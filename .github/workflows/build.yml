name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ redis-tools

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build

      - name: Start server
        run: ./build/redis_clone &

      - name: Wait for server to be ready
        run: sleep 1

      - name: Test PING
        run: |
          response=$(redis-cli -p 6379 PING)
          if [ "$response" != "PONG" ]; then
            echo "PING test failed: got '$response'"
            exit 1
          fi
          echo "PING passed"

      - name: Test SET and GET
        run: |
          redis-cli -p 6379 SET name Ahmed
          response=$(redis-cli -p 6379 GET name)
          if [ "$response" != "Ahmed" ]; then
            echo "SET/GET test failed: got '$response'"
            exit 1
          fi
          echo "SET/GET passed"

      - name: Test DEL
        run: |
          redis-cli -p 6379 SET temp value
          redis-cli -p 6379 DEL temp
          response=$(redis-cli -p 6379 GET temp)
          if [ "$response" != "" ]; then
            echo "DEL test failed: got '$response'"
            exit 1
          fi
          echo "DEL passed"

      - name: Test EXISTS
        run: |
          redis-cli -p 6379 SET existing value
          response=$(redis-cli -p 6379 EXISTS existing)
          if [ "$response" != "1" ]; then
            echo "EXISTS test failed: got '$response'"
            exit 1
          fi
          echo "EXISTS passed"

      - name: Test EXPIRE and TTL
        run: |
          redis-cli -p 6379 SET expiring value
          redis-cli -p 6379 EXPIRE expiring 100
          response=$(redis-cli -p 6379 TTL expiring)
          if [ "$response" -le "0" ]; then
            echo "EXPIRE/TTL test failed: got '$response'"
            exit 1
          fi
          echo "EXPIRE/TTL passed"

      - name: Test KEYS
        run: |
          redis-cli -p 6379 SET key1 a
          redis-cli -p 6379 SET key2 b
          redis-cli -p 6379 SET other c
          response=$(redis-cli -p 6379 KEYS "key*")
          if [ -z "$response" ]; then
            echo "KEYS test failed: got empty response"
            exit 1
          fi
          echo "KEYS passed: $response"

      - name: Test INCR and DECR
        run: |
          redis-cli -p 6379 SET counter 10
          redis-cli -p 6379 INCR counter
          response=$(redis-cli -p 6379 INCR counter)
          if [ "$response" != "12" ]; then
            echo "INCR test failed: got '$response'"
            exit 1
          fi
          redis-cli -p 6379 DECR counter
          response=$(redis-cli -p 6379 DECR counter)
          if [ "$response" != "10" ]; then
            echo "DECR test failed: got '$response'"
            exit 1
          fi
          echo "INCR/DECR passed"

      - name: Test APPEND
        run: |
          redis-cli -p 6379 DEL greeting
          redis-cli -p 6379 APPEND greeting Hello
          response=$(redis-cli -p 6379 APPEND greeting World)
          if [ "$response" != "10" ]; then
            echo "APPEND test failed: got '$response'"
            exit 1
          fi
          result=$(redis-cli -p 6379 GET greeting)
          if [ "$result" != "HelloWorld" ]; then
            echo "APPEND value test failed: got '$result'"
            exit 1
          fi
          echo "APPEND passed"

      - name: Test RENAME
        run: |
          redis-cli -p 6379 SET oldkey hello
          redis-cli -p 6379 RENAME oldkey newkey
          response=$(redis-cli -p 6379 GET newkey)
          if [ "$response" != "hello" ]; then
            echo "RENAME test failed: got '$response'"
            exit 1
          fi
          gone=$(redis-cli -p 6379 GET oldkey)
          if [ "$gone" != "" ]; then
            echo "RENAME old key still exists: got '$gone'"
            exit 1
          fi
          echo "RENAME passed"
